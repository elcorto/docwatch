reference-section-title: Refs
link-citation: true

xnos-capitalise: true
tablenos-plus-name: Tab.

header-includes:
- |
  ```{=latex}
  % https://github.com/elcorto/docwatch/issues/2
  \usepackage{hyperref}
  % "capitalise" is what "xnos-capitalise: true" does. If you don't use this
  % setting, then just \usepackage{cleveref}.
  \usepackage[capitalise]{cleveref}

  \usepackage{xspace}

  % unicode-math: only with lualatex or xelatex
  %
  % May need mathtools before unicode-math to make things like \underbrace
  % render correctly in some cases.
  %%\usepackage{mathtools}
  \usepackage{unicode-math}

  % unicode-math changes some fonts, revert that.
  % Same output as \usepackage[olddefault]{fontsetup}, but compiles faster.
  %
  % Math (regular): plain math, e.g. $O(f)$, \sum
  \setmathfont[CharacterVariant=2]{NewCMMath-Regular.otf}
  % Math (bold): \symbfit, \symbfup, e.g. \ve y
  \setmathfont[version=bold,CharacterVariant=2]{NewCMMath-Bold.otf}
  % Math (script): \mathscr{L}, \mathbfscr
  \setmathfont[range={\mathscr,\mathbfscr},StylisticSet=1,CharacterVariant=2]{NewCMMath-Regular.otf}
  % Classic Computer Modern calligraphic
  \DeclareMathAlphabet{\mathcal}{OMS}{cmsy}{m}{n}

  % For \IfInteger
  \usepackage{xstring}

  % vector: bold italic (latin, greek) or slanted (digits)
  %
  % unicode-math can't do bold slanted digits, so special-case
  % \ve <digit>
  %
  % Thanks: https://tex.stackexchange.com/a/590936
  \newcommand{\ve}[1]{%
    \IfInteger{#1}{%
      \textsl{\textbf{#1}}\xspace%
      }{%
      \ensuremath{\symbfit{#1}}\xspace%
    }
  }

  % matrix (bold upright)
  \newcommand{\ma}[1]{\ensuremath{\symbfup{#1}}\xspace}
  ```
