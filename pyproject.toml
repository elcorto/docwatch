[project]
name = "docwatch"
version = "0.0.0"
description = "Convert, preview, watch and rebuild a source document with pandoc"
readme = "README.md"
keywords = ["pandoc", "preview", "markdown", "latex", "pdf"]
requires-python = ">=3.8"
authors = [
    {name="Steve Schmerler", email="git@elcorto.com"}
]
license = {file="LICENSE"}


[project.urls]
"Homepage" = "https://github.com/elcorto/docwatch"


[project.scripts]
docwatch = "docwatch.main:main"


[project.optional-dependencies]
dev = ["pre-commit"]
filters-xnos = [
    "pandoc-eqnos",
    "pandoc-fignos",
    "pandoc-secnos",
    "pandoc-tablenos",
    "pandoc-xnos",
]


[tool.black]
line-length = 79


[tool.ruff]
line-length = 79
lint.ignore = [
    "E501", # Line too long
    "E722", # Do not use bare except
    "E731", # Do not assign a lambda expression, use a def
    "F403", # from {name} import * used; unable to detect undefined names
    # Since ruff 0.16
    "C408", # Unnecessary `dict()` call (rewrite as a literal)
    "SIM118", # Use `key in dict` instead of `key in dict.keys()`
    "I001", # Import block is un-sorted or un-formatted
    "B006", # Do not use mutable data structures for argument defaults
]


[tool.mypy]
ignore_missing_imports = true
implicit_optional = true


[build-system]
requires = ["setuptools>=66.1", "wheel"]
build-backend = "setuptools.build_meta"
